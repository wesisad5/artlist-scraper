# Artlist Catalog Scraper — Self-Chaining Full Scrape
#
# Runs ONE catalog step per workflow run (chunked execution).
# Self-chains to the next step via `gh workflow run` at the end.
# Each step has its own time budget (most are <6h, the GHA job limit).
#
# Triggers:
# - workflow_dispatch (manual, with --resume flag support)
# - schedule (every 10 min, in case chain breaks — auto-resumes)

name: Full Catalog Scrape (Self-Chaining)

on:
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from last checkpoint (true) or start fresh (false)'
        required: false
        default: 'true'
  schedule:
    # Every 10 minutes (auto-resumes if chain breaks and there's pending work)
    - cron: '*/10 * * * *'

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 30 min per step (most steps are <5 min; music/sfx/footage can take longer)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << EOF
          ARTLIST_JWT=${{ secrets.ARTLIST_JWT }}
          ARTLIST_FLOWS_SESSION_TOKEN=${{ secrets.ARTLIST_FLOWS_SESSION_TOKEN }}
          ARTLIST_FLOWS_CF_CLEARANCE=${{ secrets.ARTLIST_FLOWS_CF_CLEARANCE }}
          ARTLIST_FLOWS_CF_BM=${{ secrets.ARTLIST_FLOWS_CF_BM }}
          ARTLIST_STUDIO_SESSION_TOKEN=${{ secrets.ARTLIST_STUDIO_SESSION_TOKEN }}
          ARTLIST_STUDIO_CF_CLEARANCE=${{ secrets.ARTLIST_STUDIO_CF_CLEARANCE }}
          ARTLIST_STUDIO_CF_BM=${{ secrets.ARTLIST_STUDIO_CF_BM }}
          ARTLIST_STUDIO_CSRF_TOKEN=${{ secrets.ARTLIST_STUDIO_CSRF_TOKEN }}
          ARTLIST_USER_SESSION=${{ secrets.ARTLIST_USER_SESSION }}
          ARTLIST_VISITOR_ID=${{ secrets.ARTLIST_VISITOR_ID }}
          ARTLIST_USER_ID=${{ secrets.ARTLIST_USER_ID }}
          NETLIFY_SITE_ID=${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN=${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_BLOB_NAMESPACE=artlist-scraper
          HTTP_RATE_LIMIT_RPS=5.0
          HTTP_MAX_RETRIES=5
          EOF

      - name: Reset progress if not resuming
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.resume == 'false' }}
        run: |
          rm -f data/_meta/progress.json
          echo "Progress reset for fresh scrape"

      - name: Test auth
        run: python -m src.cli test-auth

      - name: Show current progress
        run: python -m src.cli progress

      - name: Run next pending step (resume mode)
        run: |
          python -m src.cli catalog --resume
          echo "---"
          echo "Progress after run:"
          python -m src.cli progress

      - name: Commit progress
        run: |
          git config user.email "scraper-bot@users.noreply.github.com"
          git config user.name "artlist-scraper-bot"
          git pull --rebase || true
          git add data/ || true
          git commit -m "Scrape checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          git push

      - name: Check if scrape is complete
        id: check_done
        run: |
          DONE=$(python3 -c "import json; d=json.load(open('data/_meta/progress.json')); print(d.get('done', False))")
          echo "done=$DONE" >> $GITHUB_OUTPUT
          echo "Scrape done: $DONE"

      - name: Final audit + mirror signed URLs
        if: steps.check_done.outputs.done == 'true'
        run: |
          python -m src.cli audit > audit_report.json 2>/dev/null || true
          cat audit_report.json | head -80
          echo "---"
          echo "Mirroring signed URLs to Netlify blob..."
          python -m src.cli mirror-signed || echo "Mirror failed (may need creds)"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}

      - name: Commit final results
        if: steps.check_done.outputs.done == 'true'
        run: |
          git config user.email "scraper-bot@users.noreply.github.com"
          git config user.name "artlist-scraper-bot"
          git add data/ audit_report.json || true
          git commit -m "Scrape complete + audit + mirror $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          git push

      - name: Trigger next run (self-chain)
        if: steps.check_done.outputs.done != 'true'
        run: |
          echo "Self-chaining to next run..."
          gh workflow run "$GITHUB_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            -f resume=true
          echo "Triggered next run"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Disable schedule when done (prevent infinite runs)
        if: steps.check_done.outputs.done == 'true'
        run: |
          echo "Scrape complete. Schedule will be a no-op (progress.done=true)."
          echo "To re-run, manually trigger with resume=false."
