# Artlist Catalog Scraper — Self-Chaining Full Scrape
#
# Runs the full catalog scrape in chunks, self-triggering the next run via GitHub API.
# Each run picks up where the last left off (progress tracked in data/_meta/progress.json).
# Handles the 3000-item pagination cap via combinatorial filtering.
#
# Triggers:
# - workflow_dispatch (manual, with --resume flag support)
# - workflow_run (auto-chain: when this workflow completes, trigger next run if not done)

name: Full Catalog Scrape (Self-Chaining)

on:
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from last checkpoint (true) or start fresh (false)'
        required: false
        default: 'true'
  workflow_run:
    workflows: ["Full Catalog Scrape (Self-Chaining)"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << EOF
          ARTLIST_JWT=${{ secrets.ARTLIST_JWT }}
          ARTLIST_FLOWS_SESSION_TOKEN=${{ secrets.ARTLIST_FLOWS_SESSION_TOKEN }}
          ARTLIST_FLOWS_CF_CLEARANCE=${{ secrets.ARTLIST_FLOWS_CF_CLEARANCE }}
          ARTLIST_FLOWS_CF_BM=${{ secrets.ARTLIST_FLOWS_CF_BM }}
          ARTLIST_STUDIO_SESSION_TOKEN=${{ secrets.ARTLIST_STUDIO_SESSION_TOKEN }}
          ARTLIST_STUDIO_CF_CLEARANCE=${{ secrets.ARTLIST_STUDIO_CF_CLEARANCE }}
          ARTLIST_STUDIO_CF_BM=${{ secrets.ARTLIST_STUDIO_CF_BM }}
          ARTLIST_STUDIO_CSRF_TOKEN=${{ secrets.ARTLIST_STUDIO_CSRF_TOKEN }}
          ARTLIST_USER_SESSION=${{ secrets.ARTLIST_USER_SESSION }}
          ARTLIST_VISITOR_ID=${{ secrets.ARTLIST_VISITOR_ID }}
          ARTLIST_USER_ID=${{ secrets.ARTLIST_USER_ID }}
          NETLIFY_SITE_ID=${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN=${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_BLOB_NAMESPACE=artlist-scraper
          HTTP_RATE_LIMIT_RPS=5.0
          HTTP_MAX_RETRIES=5
          EOF

      - name: Test auth
        run: python -m src.cli test-auth

      - name: Run scrape chunk (10 min budget)
        run: |
          RESUME="${{ github.event.inputs.resume || 'true' }}"
          if [ "$RESUME" = "true" ] && [ -f data/_meta/progress.json ]; then
            echo "Resuming from checkpoint..."
            python -m src.cli catalog --resume
          else
            echo "Starting fresh scrape..."
            python -m src.cli catalog
          fi

      - name: Check if scrape is complete
        id: check_done
        run: |
          if [ -f data/_meta/progress.json ]; then
            DONE=$(python -c "import json; d=json.load(open('data/_meta/progress.json')); print(d.get('done', False))")
            echo "done=$DONE" >> $GITHUB_OUTPUT
          else
            echo "done=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit progress
        run: |
          git config user.email "scraper-bot@users.noreply.github.com"
          git config user.name "artlist-scraper-bot"
          git add data/ || true
          git commit -m "Scrape checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          git push

      - name: Trigger next run (self-chain)
        if: steps.check_done.outputs.done != 'true'
        run: |
          gh workflow run "$GITHUB_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            -f resume=true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Upload audit report
        if: steps.check_done.outputs.done == 'true'
        run: |
          python -m src.cli audit > audit_report.json 2>/dev/null || true
          cat audit_report.json | head -50

      - name: Mirror signed URLs to Netlify blob
        if: steps.check_done.outputs.done == 'true'
        run: python -m src.cli mirror-signed
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
