name: Codespace Keeper
on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure codespace alive
        run: |
          CS_NAME="artlist-runner-7v4ppp7qp9j4fxj7x"
          PAT="${{ secrets.GH_PAT }}"
          
          # Check state
          STATE=$(curl -s -H "Authorization: token $PAT" \
            "https://api.github.com/user/codespaces/$CS_NAME" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('state','NOT_FOUND'))")
          
          echo "Codespace state: $STATE"
          
          if [ "$STATE" = "Shutdown" ]; then
            echo "Starting codespace..."
            curl -s -X POST -H "Authorization: token $PAT" \
              "https://api.github.com/user/codespaces/$CS_NAME/start"
            echo "Started. Waiting for Available..."
            for i in $(seq 1 12); do
              sleep 10
              STATE=$(curl -s -H "Authorization: token $PAT" \
                "https://api.github.com/user/codespaces/$CS_NAME" | \
                python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('state','NOT_FOUND'))")
              echo "  Poll $i: $STATE"
              [ "$STATE" = "Available" ] && break
            done
          fi
          
          # Ping to reset idle timer
          if [ "$STATE" = "Available" ]; then
            curl -s -H "Authorization: token $PAT" \
              "https://api.github.com/user/codespaces/$CS_NAME/machines" > /dev/null
            echo "Pinged codespace to reset idle timer."
          fi
